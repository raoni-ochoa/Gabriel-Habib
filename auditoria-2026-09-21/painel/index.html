<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auditoria Atendimento Humano</title>
<meta name="description" content="Painel de diagnóstico do atendimento humano no Kommo (funil Manual) — Gabriel Habib">
<style>
:root{color-scheme:light;--bg:#fcfcfb;--surface:#ffffff;--border:#e3e2dd;--text:#0b0b0b;--text2:#52514e;--muted:#8a8985;
 --human:#2a78d6;--lead:#eb6834;--robot:#1baf7a;--system:#6b6a66;--accent:#2a78d6;--warn-bg:#fff4e0;--warn-fg:#7a4a00;--ok-bg:#e8f5ee;--ok-fg:#0f5a34;--info-bg:#eaf1fb;--info-fg:#1d4f8f;
 --radius:10px;--fs:16px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1a1a19;--surface:#232322;--border:#3a3937;--text:#fff;--text2:#c3c2b7;--muted:#8f8e88;--human:#3987e5;--lead:#d95926;--robot:#199e70;--system:#a09f99;--accent:#3987e5;--warn-bg:#3a2a08;--warn-fg:#f5c96b;--ok-bg:#0f2f1f;--ok-fg:#8fd6ae;--info-bg:#142a45;--info-fg:#9cc3f0}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1a1a19;--surface:#232322;--border:#3a3937;--text:#fff;--text2:#c3c2b7;--muted:#8f8e88;--human:#3987e5;--lead:#d95926;--robot:#199e70;--system:#a09f99;--accent:#3987e5;--warn-bg:#3a2a08;--warn-fg:#f5c96b;--ok-bg:#0f2f1f;--ok-fg:#8fd6ae;--info-bg:#142a45;--info-fg:#9cc3f0}
*{box-sizing:border-box}html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header h1{font-size:1.05rem;margin:0 12px 0 0}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav button,.btn{background:transparent;border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:999px;cursor:pointer;font:inherit;font-size:.9rem}
nav button[aria-current="page"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.tools{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px}
.btn[aria-pressed="true"]{background:var(--info-bg);color:var(--info-fg);border-color:var(--accent)}
main{max-width:1400px;margin:0 auto;padding:16px}
section[hidden]{display:none}
h2{font-size:1.4rem;margin:8px 0 12px}h3{font-size:1.1rem;margin:18px 0 8px}h4{margin:12px 0 6px;font-size:1rem}
.banner{padding:14px 16px;border-radius:var(--radius);margin:0 0 16px;border:1px solid var(--border)}
.banner.warn{background:var(--warn-bg);color:var(--warn-fg)}.banner.info{background:var(--info-bg);color:var(--info-fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.tile .v{font-size:1.9rem;font-weight:600;line-height:1.1}.tile .l{color:var(--text2);font-size:.9rem}.tile .d{color:var(--muted);font-size:.8rem;margin-top:4px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin:12px 0}
table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{padding:8px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{color:var(--text2);font-weight:600;cursor:pointer;white-space:nowrap;background:var(--surface)}
th[aria-sort="ascending"]::after{content:" ▲"}th[aria-sort="descending"]::after{content:" ▼"}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.filters input,.filters select{font:inherit;padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.78rem;border:1px solid var(--border);color:var(--text2);white-space:nowrap}
.pill.human{border-color:var(--human);color:var(--human)}.pill.lead{border-color:var(--lead);color:var(--lead)}.pill.robot{border-color:var(--robot);color:var(--robot)}.pill.system,.pill.undetermined{border-color:var(--system);color:var(--system)}
.tl{list-style:none;margin:0;padding:0}.tl li{display:grid;grid-template-columns:150px 110px 1fr;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:.92rem}
.tl li .t{color:var(--text2);white-space:nowrap}.tl li.human{border-left:3px solid var(--human);padding-left:8px}.tl li.lead{border-left:3px solid var(--lead);padding-left:8px}.tl li.robot{border-left:3px solid var(--robot);padding-left:8px}.tl li.system,.tl li.undetermined{border-left:3px solid var(--system);padding-left:8px}
.ref{color:var(--muted);font-size:.78rem;word-break:break-all}
.bar{height:10px;border-radius:4px;background:var(--human);display:inline-block;vertical-align:middle}
.small{color:var(--text2);font-size:.85rem}.muted{color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:800px){.two{grid-template-columns:1fr}.tl li{grid-template-columns:1fr}}
.ovs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}@media(max-width:900px){.ovs{grid-template-columns:1fr}}
.ovs>div{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px}
a{color:var(--accent)}a.ext::after{content:" ↗";font-size:.8em}
details summary{cursor:pointer;font-weight:600}
.pii{transition:filter .2s}body.present .pii{filter:blur(6px);user-select:none}body.present .pii-hide{display:none!important}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.85rem;color:var(--text2);margin:6px 0 10px}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.kpi-def{font-size:.8rem;color:var(--muted)}
@media print{header,nav,.tools,.filters,.noprint{display:none!important}body{background:#fff;color:#000;font-size:11pt}section[hidden]{display:block!important}main{max-width:none}.card,.tile,.tablewrap{break-inside:avoid;border-color:#bbb}a{color:#000;text-decoration:none}.tl li{grid-template-columns:130px 90px 1fr}}
</style>
</head>
<body>
<header>
 <h1>Auditoria · Atendimento humano · Gabriel Habib · Kommo</h1>
 <nav id="nav" aria-label="Seções">
  <button data-sec="exec" aria-current="page">Visão executiva</button>
  <button data-sec="comp">Comparativo</button>
  <button data-sec="det">Análise detalhada</button>
  <button data-sec="diag">Diagnóstico e treinamento</button>
  <button data-sec="met">Metodologia e cobertura</button>
 </nav>
 <div class="tools">
  <button class="btn" id="btnCsv" title="Exporta os indicadores por lead dos casos filtrados">Exportar CSV</button>
  <button class="btn" id="btnPrint">Imprimir</button>
  <button class="btn" id="btnPresent" aria-pressed="false" title="Oculta nomes, telefones, links e textos na tela (não anonimiza arquivos)">Modo apresentação</button>
  <button class="btn" id="btnFont" title="Aumentar/diminuir fonte">A±</button>
  <button class="btn" id="btnTheme" title="Tema claro/escuro">☾</button>
 </div>
</header>
<main>
 <div id="banner"></div>
 <section id="sec-exec"><h2>Visão executiva</h2><div id="exec"></div></section>
 <section id="sec-comp" hidden><h2>Comparativo dos casos</h2><div id="comp"></div></section>
 <section id="sec-det" hidden><h2>Análise detalhada</h2><div id="det"></div></section>
 <section id="sec-diag" hidden><h2>Diagnóstico e treinamento</h2><div id="diag"></div></section>
 <section id="sec-met" hidden><h2>Metodologia e cobertura</h2><div id="met"></div></section>
</main>
<script src="data.js"></script>
<script>
(function(){
const D = window.AUDIT_DATA || {status:'sem_dados'};
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDt = s => { if(!s) return '—'; const d=new Date(s); return isNaN(d)?esc(s):d.toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}); };
const fmtH = v => (v==null||v==='NA'||v==='DI')?({NA:'n/a',DI:'indisp.'}[v]||'—'):(v>=48?(v/24).toFixed(1)+' d':v+' h');
const val = (c,k) => { const i=c.indicadores&&c.indicadores[k]; return i?i.valor:null; };
const num = v => (typeof v==='number')?v:null;
const ACT = {human:'Humano',lead:'Lead',robot:'Robô',system:'Sistema',undetermined:'Indeterminado'};
const ACTION = {message:'mensagem',call_attempt:'ligação de saída (não atendida)',call_answered:'ligação de saída atendida',call_incoming:'ligação recebida',call_incoming_missed:'ligação recebida perdida',note:'nota',task_created:'tarefa criada',task_completed:'tarefa concluída',stage_change:'mudança de etapa',responsible_change:'mudança de responsável',tag_added:'tag adicionada',transfer:'transferência para humano',document_sent:'documento enviado',document_signed:'documento assinado',meeting_offered:'reunião oferecida',meeting_accepted:'reunião aceita',meeting_scheduled:'reunião agendada',meeting_confirmed:'reunião confirmada',meeting_done:'reunião realizada',meeting_noshow:'ausência confirmada',meeting_reschedule:'tentativa de reagendamento',proposal_presented:'proposta/condições apresentadas',legal_handoff:'passagem ao jurídico',other:'outro'};
const WAIT = {aguardando_equipe:'Aguardando a equipe',aguardando_lead:'Aguardando o lead',retorno_combinado:'Retorno combinado',encerrado:'Encerrado',nao_determinavel:'Não determinável'};
const MSTONE = ['meeting_offered','meeting_accepted','meeting_scheduled','meeting_confirmed','meeting_done','meeting_noshow','meeting_reschedule','proposal_presented','document_sent','document_signed','legal_handoff'];
const casos = D.casos||[]; const cons = D.consolidado||{}; const cov = D.cobertura||{};
const empty = D.status!=='ok' || !casos.length;
const state = {q:'',atend:'',serv:'',etapa:'',res:'',grav:'',sort:'nome',dir:1};

// ---------- banner ----------
(function(){
 const m=D.meta||{};
 let html='';
 if(empty){
  html+=`<div class="banner warn"><strong>Sem dados coletados do CRM.</strong> Este painel está em estado vazio: nenhum caso foi analisado ainda. Nenhum número abaixo é real; os controles ficam desativados até a coleta.
  ${D.bloqueios&&D.bloqueios.length?'<ul>'+D.bloqueios.map(b=>'<li>'+esc(b)+'</li>').join('')+'</ul>':''}
  <div class="small">Para popular: siga <code>coleta/navegador/README.md</code> ou <code>coleta/kommo_api/collect.py</code> e rode <code>python3 src/build.py</code>. Detalhes em <code>docs/ACESSO_E_BLOQUEIOS.md</code>.</div></div>`;
 }
 if(D.anonimizado){ html+=`<div class="banner info">Pacote anonimizado: nomes, telefones, links e textos foram removidos do arquivo de dados.</div>`; }
 html+=`<div class="small">Cliente: <strong>${esc(m.cliente||'Gabriel Habib')}</strong> · CRM: Kommo · Funil: <strong>${esc(m.funil||'Manual')}</strong> (id ${esc(m.pipeline_id||'13587595')}) · Período: ${m.window_days?esc(m.window_days)+' dias antes do corte':'não definido'} · Corte: <strong>${m.cutoff?fmtDt(m.cutoff):'coleta não realizada'}</strong> · Gerado em ${fmtDt(D.generated_at)} · Amostra intencional: ${casos.length} casos (sem extrapolação para a operação)</div>`;
 $('#banner').innerHTML=html;
})();

// ---------- helpers ----------
function tile(v,l,d){return `<div class="tile"><div class="v">${v}</div><div class="l">${l}</div>${d?`<div class="d">${d}</div>`:''}</div>`;}
function consTile(key,label,unit){ const k=cons.indicadores&&cons.indicadores[key]; if(!k) return tile('—',label,'sem dados'); const v=k.mediana==null?'—':(unit==='h'?fmtH(k.mediana):k.mediana); return tile(v,label,`Mediana por lead · ${esc(k.denominador)} com dado${k.n_na?` · ${k.n_na} n/a`:''}${k.n_indisponivel?` · ${k.n_indisponivel} indisp.`:''}<br><span class="kpi-def">${esc(k.definicao)}</span>`); }
function sumTile(key,label){ const k=cons.indicadores&&cons.indicadores[key]; if(!k) return tile('—',label,'sem dados'); return tile(k.soma==null?'—':k.soma,label,`Soma · ${esc(k.denominador)}<br><span class="kpi-def">${esc(k.definicao)}</span>`); }
function leadLink(c){ return c.url?`<a class="ext pii" href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.nome||('lead '+c.id))}</a>`:`<span class="pii">${esc(c.nome||('lead '+c.id))}</span>`; }
function mstones(c){ const m=c.marcos||{}; const on=MSTONE.filter(k=>m[k]&&m[k].ocorreu).map(k=>ACTION[k]); const docs=[]; if(m.contrato_enviado)docs.push('contrato enviado'); if(m.contrato_assinado_confirmado)docs.push('contrato assinado ✔'); if(m.procuracao_enviado)docs.push('procuração enviada'); if(m.procuracao_assinado_confirmado)docs.push('procuração assinada ✔'); return {reuniao:on.filter(x=>x.startsWith('reunião')||x.startsWith('ausência')||x.startsWith('tentativa')).join(', ')||'—', docs:docs.join(', ')||'—'}; }

// ---------- visão executiva ----------
(function(){
 if(empty){ $('#exec').innerHTML=`<div class="grid">${tile('0','Casos analisados','nenhuma coleta')}${tile('0','Chamadas localizadas','')}${tile('0','Gravações acessíveis','')}${tile('—','Mediana transferência → 1ª tentativa humana','sem dados')}</div>
 <div class="card"><h3>Principais indicadores, acertos e prioridades</h3><p class="muted">Serão preenchidos com dados reais após a coleta. Nenhum conteúdo fictício é exibido.</p></div>`; return; }
 const abertos = casos.filter(c=>c.status_espera==='aguardando_equipe');
 const comLig = casos.filter(c=>num(val(c,'tentativas_ligacao_saida'))>0);
 const reun = casos.filter(c=>{const m=c.marcos||{};return ['meeting_offered','meeting_scheduled','meeting_done'].some(k=>m[k]&&m[k].ocorreu);});
 const docs = casos.filter(c=>{const m=c.marcos||{};return m.contrato_enviado||m.procuracao_enviado;});
 const assin = casos.filter(c=>{const m=c.marcos||{};return m.contrato_assinado_confirmado||m.procuracao_assinado_confirmado;});
 let h=`<div class="grid">
  ${tile(casos.length,'Casos analisados',`Cobertura: ${cov.conversas_com_conteudo||0} com conteúdo de conversa acessível`)}
  ${tile(`${cov.chamadas_localizadas||0}`,'Chamadas localizadas',`${cov.chamadas_atendidas||0} atendidas · ${cov.gravacoes_com_link||0} com link · ${cov.gravacoes_acessiveis||0} acessíveis · ${cov.transcritas||0} transcritas · ${cov.ligacoes_analisadas||0} analisadas`)}
  ${consTile('h_transf_primeira_tentativa','Transferência → 1ª tentativa humana','h')}
  ${consTile('h_transf_primeira_conversa','Transferência → 1ª conversa efetiva','h')}
  ${consTile('mediana_resposta_h','Tempo de resposta ao lead (episódios concluídos)','h')}
  ${tile(`${abertos.length} de ${casos.length}`,'Esperas pendentes no corte (aguardando a equipe)', abertos.length?abertos.map(c=>`${leadLink(c)}: ${fmtH(val(c,'espera_aberta_h'))}`).join(' · '):'nenhuma')}
  ${tile(`${comLig.length} de ${casos.length}`,'Casos com ≥1 tentativa de ligação humana',`${sumOf('tentativas_ligacao_saida')} tentativas · ${sumOf('ligacoes_saida_atendidas')} atendidas`)}
  ${tile(`${reun.length} de ${casos.length}`,'Casos com reunião oferecida/agendada/realizada','contratação por texto não conta como falha')}
  ${tile(`${docs.length} de ${casos.length}`,'Casos com contrato ou procuração enviados',`${assin.length} com assinatura comprovada`)}
  ${tile(avgNote(),'Nota média da rubrica (0–100)',`cobertura média ${avgCov()} critérios`)}
 </div>`;
 h+=`<div class="two"><div class="card"><h3>Acertos observados</h3>${list(D.acertos_gerais,'Nenhum acerto registrado ainda.')}</div>
 <div class="card"><h3>Prioridades (até 5)</h3>${list((D.prioridades||[]).slice(0,5).map(p=>typeof p==='string'?p:`<strong>${esc(p.titulo||'')}</strong> — ${esc(p.descricao||'')} <span class="small">(${esc(p.frequencia||'')})</span>`),'Nenhuma prioridade registrada ainda.',true)}</div></div>`;
 h+=`<div class="card"><h3>Situação das esperas</h3><table><tr><th>Status</th><th>Casos</th></tr>${Object.entries(cons.status_espera||{}).map(([k,v])=>`<tr><td>${WAIT[k]||k}</td><td>${v} de ${casos.length}</td></tr>`).join('')}</table>
 <p class="small">Transferência: ${Object.entries(cons.transferencia||{}).map(([k,v])=>`${k}: ${v}`).join(' · ')}</p></div>`;
 $('#exec').innerHTML=h;
 function sumOf(k){const x=cons.indicadores&&cons.indicadores[k];return x&&x.soma!=null?x.soma:0;}
 function avgNote(){const n=casos.map(c=>c.rubrica&&c.rubrica.nota_normalizada).filter(x=>typeof x==='number');return n.length?(n.reduce((a,b)=>a+b,0)/n.length).toFixed(0):'—';}
 function avgCov(){const n=casos.map(c=>c.rubrica&&c.rubrica.criterios_avaliados).filter(x=>typeof x==='number');return n.length?(n.reduce((a,b)=>a+b,0)/n.length).toFixed(1):'—';}
})();
function list(arr,emptyMsg,raw){ if(!arr||!arr.length) return `<p class="muted">${emptyMsg}</p>`; return '<ul>'+arr.map(x=>`<li>${raw?x:esc(typeof x==='string'?x:JSON.stringify(x))}</li>`).join('')+'</ul>'; }

// ---------- comparativo ----------
const COLS=[['nome','Lead',c=>leadLink(c)],['servico','Serviço',c=>esc(c.servico||'—')],['atendentes','Atendentes',c=>`<span class="pii">${esc((c.atendentes||[]).join(', ')||'—')}</span>`],['etapa_atual','Etapa atual',c=>esc(c.etapa_atual||'—')],['etapa_max','Maior etapa',c=>esc(c.etapa_max||'—')],['status','Resultado',c=>esc({won:'ganho',lost:'perdido',open:'em aberto'}[c.status]||c.status||'—')],
 ['h_transf_primeira_tentativa','Transf.→1º contato humano',c=>fmtH(val(c,'h_transf_primeira_tentativa'))],['msgs_humanas','Msgs humanas',c=>val(c,'msgs_humanas')??'—'],['msgs_lead','Msgs lead',c=>val(c,'msgs_lead')??'—'],['tentativas_ligacao_saida','Tent. ligação',c=>`${val(c,'tentativas_ligacao_saida')??'—'} (${val(c,'ligacoes_saida_atendidas')??0} atend.)`],['abordagens_followup','Follow-ups',c=>val(c,'abordagens_followup')??'—'],['reuniao','Reunião',c=>esc(mstones(c).reuniao)],['docs','Documentos',c=>esc(mstones(c).docs)],['espera','Espera',c=>c.status_espera==='aguardando_equipe'?`<strong>${WAIT[c.status_espera]} · ${fmtH(val(c,'espera_aberta_h'))}</strong>`:esc(WAIT[c.status_espera]||'—')],['proxima_acao','Próxima ação',c=>esc(c.proxima_acao||'—')],['nota','Nota / cobertura',c=>c.rubrica&&c.rubrica.nota_normalizada!=null?`${c.rubrica.nota_normalizada} <span class="small">(${esc(c.rubrica.cobertura)})</span>`:'—'],['det','',c=>`<button class="btn" data-open="${esc(c.id)}">Dossiê</button>`]];
function sortKey(c,k){ if(k==='nota') return c.rubrica?c.rubrica.nota_normalizada:null; if(k==='espera') return val(c,'espera_aberta_h'); if(k==='reuniao'||k==='docs') return mstones(c)[k]; if(c.indicadores&&c.indicadores[k]) return num(val(c,k)); const v=c[k]; return Array.isArray(v)?v.join(','):v; }
function filtered(){ return casos.filter(c=>{ const t=JSON.stringify([c.nome,c.id,c.servico,c.atendentes,c.etapa_atual,c.proxima_acao]).toLowerCase(); if(state.q&&!t.includes(state.q.toLowerCase()))return false; if(state.atend&&!(c.atendentes||[]).includes(state.atend))return false; if(state.serv&&c.servico!==state.serv)return false; if(state.etapa&&c.etapa_atual!==state.etapa)return false; if(state.res&&c.status!==state.res)return false; if(state.grav==='sim'&&!(c.chamadas&&c.chamadas.gravacao_acessivel>0))return false; if(state.grav==='nao'&&(c.chamadas&&c.chamadas.gravacao_acessivel>0))return false; return true; }).sort((a,b)=>{ const x=sortKey(a,state.sort),y=sortKey(b,state.sort); if(x==null&&y==null)return 0; if(x==null)return 1; if(y==null)return -1; return (x<y?-1:x>y?1:0)*state.dir; }); }
function renderComp(){
 if(empty){ $('#comp').innerHTML=`<p class="muted">Tabela comparativa vazia: nenhum caso coletado. Filtros e ordenação ficam disponíveis após a coleta.</p>`; return; }
 const uniq=k=>[...new Set(casos.flatMap(c=>k==='atendentes'?(c.atendentes||[]):[c[k]]).filter(Boolean))];
 const opt=(arr,sel)=>arr.map(v=>`<option ${sel===v?'selected':''}>${esc(v)}</option>`).join('');
 const rows=filtered();
 $('#comp').innerHTML=`<div class="filters noprint">
  <input id="fq" placeholder="Pesquisar lead, serviço, atendente…" value="${esc(state.q)}">
  <select id="fa"><option value="">Atendente (todos)</option>${opt(uniq('atendentes'),state.atend)}</select>
  <select id="fs"><option value="">Serviço (todos)</option>${opt(uniq('servico'),state.serv)}</select>
  <select id="fe"><option value="">Etapa (todas)</option>${opt(uniq('etapa_atual'),state.etapa)}</select>
